name: Buscar fotos
on:
  push:
    paths: ['tools/buscar_fotos.py', '.github/workflows/fotos.yml']
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/buscar_fotos.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cand
          git commit -m "Fotos candidatas" || echo nada
          git push
